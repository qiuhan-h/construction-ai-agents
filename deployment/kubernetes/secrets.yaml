# K8s Secrets — 敏感凭证注入（7a-3 实装）。
#
# 渲染策略（生产）：
#   1. CI/CD 从 Vault / Sealed Secrets 渲染真实值后 apply；
#   2. 本文件仅提供结构模板，stringData 值为占位标记 "<REPLACE_VIA_CI>"；
#   3. 严禁将真实密钥提交到 Git；
#   4. Deployment 通过 envFrom 引用此 Secret。
#
# 本地 dry-run 验证：
#   kubectl apply --dry-run=client -f deployment/kubernetes/secrets.yaml
#
# 真实渲染示例（CI 侧）：
#   kubectl create secret generic caai-secrets \
#     --from-literal=DATABASE_URL='postgresql+psycopg://...' \
#     --from-literal=API_JWT_SECRET='...' \
#     --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: caai-secrets
  namespace: caai
  labels:
    app.kubernetes.io/name: construction-ai-agents
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # ---------- 数据库 / 缓存 ----------
  DATABASE_URL: "<REPLACE_VIA_CI>"
  REDIS_URL: "<REPLACE_VIA_CI>"
  CELERY_BROKER_URL: "<REPLACE_VIA_CI>"
  CELERY_RESULT_BACKEND: "<REPLACE_VIA_CI>"

  # ---------- 时序库 ----------
  TSDB_URL: "<REPLACE_VIA_CI>"
  TSDB_TOKEN: "<REPLACE_VIA_CI>"
  TSDB_ORG: "<REPLACE_VIA_CI>"
  TSDB_BUCKET: "<REPLACE_VIA_CI>"

  # ---------- LLM ----------
  LLM_API_KEY: "<REPLACE_VIA_CI>"
  LLM_BASE_URL: "<REPLACE_VIA_CI>"
  LLM_DEFAULT_MODEL: "<REPLACE_VIA_CI>"

  # ---------- 认证 ----------
  API_JWT_SECRET: "<REPLACE_VIA_CI>"

  # ---------- 通知渠道 ----------
  DINGTALK_WEBHOOK: "<REPLACE_VIA_CI>"
  DINGTALK_SECRET: "<REPLACE_VIA_CI>"
  WECOM_WEBHOOK: "<REPLACE_VIA_CI>"
  ALIYUN_SMS_ACCESS_KEY_ID: "<REPLACE_VIA_CI>"
  ALIYUN_SMS_ACCESS_KEY_SECRET: "<REPLACE_VIA_CI>"
  ALIYUN_SMS_SIGN_NAME: "<REPLACE_VIA_CI>"
  ALIYUN_SMS_TEMPLATE_CODE: "<REPLACE_VIA_CI>"
  TENCENT_SMS_SECRET_ID: "<REPLACE_VIA_CI>"
  TENCENT_SMS_SECRET_KEY: "<REPLACE_VIA_CI>"
  TENCENT_SMS_APP_ID: "<REPLACE_VIA_CI>"

  # ---------- 内嵌应用（钉钉 ISV / 企微） ----------
  DINGTALK_CORP_ID: "<REPLACE_VIA_CI>"
  DINGTALK_APP_KEY: "<REPLACE_VIA_CI>"
  DINGTALK_APP_SECRET: "<REPLACE_VIA_CI>"
  DINGTALK_AGENT_ID: "<REPLACE_VIA_CI>"
  WECOM_CORP_ID: "<REPLACE_VIA_CI>"
  WECOM_SECRET: "<REPLACE_VIA_CI>"
  WECOM_AGENT_ID: "<REPLACE_VIA_CI>"

  # ---------- BIM (APS) ----------
  APS_CLIENT_ID: "<REPLACE_VIA_CI>"
  APS_CLIENT_SECRET: "<REPLACE_VIA_CI>"
  APS_HUB_ID: "<REPLACE_VIA_CI>"
  APS_PROJECT_ID: "<REPLACE_VIA_CI>"

  # ---------- IoT (MQTT) ----------
  MQTT_BROKER: "<REPLACE_VIA_CI>"
  MQTT_PORT: "<REPLACE_VIA_CI>"
