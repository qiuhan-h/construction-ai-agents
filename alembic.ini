# =====================================================
# Alembic 迁移配置
# 连接串由 migrations/env.py 从 config.get_settings().database_url 注入，
# 此处 sqlalchemy.url 仅作占位，禁止写入真实凭据。
# 常用命令（仓库根目录）：
#   alembic revision --autogenerate -m "描述"
#   alembic upgrade head
#   alembic downgrade -1
# =====================================================

[alembic]
script_location = models/database/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
