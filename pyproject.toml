[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "construction-ai-agents"
version = "0.1.0"
description = "建筑工程多智能体协作平台：施工安全审核 / 合规校验 / 现场监控"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Construction AI Team" }]

# 运行时核心依赖（API 服务最小可启动集）。重型依赖以可选分组按需安装。
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0.1",
    "orjson>=3.10",
    "httpx>=0.27",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "celery>=5.4",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]
messaging = [
    "aio-pika>=9.4",
]
geo = [
    "geopandas>=0.14",
    "shapely>=2.0",
]
langchain = [
    "langchain>=0.2",
    "langchain-openai>=0.1",
]
vector = [
    "chromadb>=0.5",
]
frontend = [
    "streamlit>=1.35",
    "websocket-client>=1.6",
]
tsdb = [
    "influxdb-client>=1.42",
]
observability = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "prometheus_client>=0.20",
]
security = [
    "gmssl>=3.2",
]
mqtt = [
    "paho-mqtt>=2.0",
]
bim = [
    "ifcopenshell>=0.7",
]

[tool.hatch.build.targets.wheel]
# 平铺布局：以仓库根为包搜索路径，打包 config / common / core / agents / ...
packages = ["config", "common", "core", "agents", "models", "services", "api"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "deployment"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    "E501",  # 行长度交给格式化器
    "B008",  # FastAPI 标准写法：Depends() 放在参数默认值
    "UP042", # StrEnum vs (str, Enum) — 保持旧写法兼容 Python 3.10
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 老业务智能体的 ``tests/<agent>/test_agent.py`` 仍为 ``__main__`` 脚本式自检
# （含 ``sys.exit()``），会被 pytest collection 报 INTERNALERROR。
# 这里开启 ``--continue-on-collection-errors`` 让整轮不被一个文件卡死。
addopts = "-q --continue-on-collection-errors"
# 4c 编排器测试是脚本式自检（24/24 通过），但同一份逻辑也提供了
# ``tests/orchestrator/test_orchestrator_pytest.py`` 给 pytest 跑。两边一一对应。

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
# 可选依赖（redis/yaml/jose/paho/alembic/chromadb/langchain 等）无类型 stub，
# 运行时均有 try/except 降级；类型检查统一忽略缺失导入。
ignore_missing_imports = true
# 测试 / 运维脚本 / 工具 / Streamlit 前端不纳入严格类型检查（mypy 对无
# __init__.py 的脚本目录按顶层模块解析，overrides 无法覆盖，直接 exclude）。
exclude = [
    '(^|/)(tests|tools|scripts|streamlit_app)(/|$)',
    '(^|/)migrations(/|$)',
]

# 第三方可选依赖：已安装但无类型 stub（运行时均有 try/except 降级）。
[[tool.mypy.overrides]]
module = [
    "redis", "redis.*",
    "yaml", "yaml.*",
    "jose", "jose.*",
    "paho", "paho.*",
    "sqlparse", "sqlparse.*",
    "alembic", "alembic.*",
    "chromadb", "chromadb.*",
    "langchain", "langchain.*",
    "gmssl", "gmssl.*",
    "ifcopenshell", "ifcopenshell.*",
    "influxdb_client", "influxdb_client.*",
    "streamlit", "streamlit.*",
    "geopandas", "geopandas.*",
    "shapely", "shapely.*",
]
ignore_missing_imports = true

